name: Deploy Android to Production

on:
  push:
    tags:
      - 'v*'
      - '!v*-ios'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: zyncro

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=/home/runner/work/keystore/zyncro-release.jks" >> android/key.properties
        working-directory: zyncro

      - name: Decode keystore
        run: |
          mkdir -p /home/runner/work/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /home/runner/work/keystore/zyncro-release.jks

      - name: Build Android App Bundle
        run: flutter build appbundle --release --build-number=$(( ${{ github.run_number }} + 100 ))
        working-directory: zyncro

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.zyncro.app
          releaseFiles: zyncro/build/app/outputs/bundle/release/app-release.aab
          track: alpha
