# Analyse statique de Zyncro.
#
# Objectif : `flutter analyze` à 0 issue (infos comprises) sur chaque commit.
# Base : flutter_lints + modes stricts du langage + règles choisies pour
# la robustesse (futures, streams, typage) et la cohérence (imports, const).
# Toute exception locale (`// ignore:`) doit être justifiée en commentaire.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
  exclude:
    - lib/firebase_options.dart
    - build/**
    - packages/**

linter:
  rules:
    # ── Robustesse ────────────────────────────────────────────────────────
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_returning_null_for_void
    - avoid_slow_async_io
    - avoid_type_to_string
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - use_build_context_synchronously

    # ── Cohérence ─────────────────────────────────────────────────────────
    - always_use_package_imports
    - directives_ordering
    - prefer_single_quotes
    - sort_child_properties_last
    - use_named_constants
    - use_super_parameters

    # ── Immutabilité et performance (const) ───────────────────────────────
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals

    # ── Simplicité ────────────────────────────────────────────────────────
    - avoid_redundant_argument_values
    - avoid_unused_constructor_parameters
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
