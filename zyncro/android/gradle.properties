org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# R8 "full mode" (activé par défaut avec AGP 8+) casse le codec Pigeon natif de
# cloud_firestore en build release → ClassCastException (ArrayList -> Boolean)
# dans PigeonSnapshotMetadata.fromList → les snapshots() ne s'établissent jamais
# (spinner infini). Le mode compat corrige ça. Ne pas réactiver sans tester un
# build release des groupes/chat/notes.
android.enableR8.fullMode=false
