org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# R8 "full mode" (activé par défaut avec AGP 8+) casse le codec Pigeon natif de
# cloud_firestore en build release → ClassCastException (ArrayList -> Boolean)
# dans PigeonSnapshotMetadata.fromList → les snapshots() ne s'établissent jamais
# (spinner infini). Le mode compat corrige ça. Ne pas réactiver sans tester un
# build release des groupes/chat/notes.
android.enableR8.fullMode=false
# Certains plugins (ex. receive_sharing_intent) ne fixent pas leur jvmTarget ;
# sous JDK 21, Gradle détecte alors un mismatch Java(1.8)/Kotlin(21) et échoue.
# Ces plugins n'ont pas de sources Java → le mismatch est bénin. On rétrograde
# la validation en avertissement pour laisser la compilation aboutir.
kotlin.jvm.target.validation.mode=warning
